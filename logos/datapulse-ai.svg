<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <filter id="glowPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glowing Circular Ring -->
  <circle cx="64" cy="64" r="58" fill="rgba(217,70,239,0.08)" stroke="url(#pulseGrad)" stroke-width="4" filter="url(#glowPulse)"/>
  
  <g transform="translate(24, 30)" filter="url(#glowPulse)">
    <!-- Dashboard Bars -->
    <rect x="5" y="45" width="12" height="25" rx="3" fill="#D946EF" />
    <rect x="25" y="25" width="12" height="45" rx="3" fill="#EC4899" />
    <rect x="45" y="10" width="12" height="60" rx="3" fill="#BE185D" />
    <rect x="65" y="35" width="12" height="35" rx="3" fill="#9D174D" />

    <!-- Pulse Line Overlay -->
    <path d="M 0 50 L 15 50 L 30 20 L 50 70 L 65 30 L 80 30" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Data Nodes -->
    <circle cx="15" cy="50" r="4" fill="#FFFFFF" />
    <circle cx="30" cy="20" r="4" fill="#FFFFFF" />
    <circle cx="50" cy="70" r="4" fill="#FFFFFF" />
    <circle cx="65" cy="30" r="4" fill="#FFFFFF" />
  </g>
</svg>
